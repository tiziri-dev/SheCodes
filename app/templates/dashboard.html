<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SheCodes - Tableau de bord</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; }
        nav {
            background: #1a73e8; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav .brand { font-size: 20px; font-weight: bold; }
        nav button {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer;
        }
        nav button:hover { background: rgba(255,255,255,0.3); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { color: #333; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card {
            background: white; padding: 25px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .card h3 { margin: 0 0 10px; color: #1a73e8; }
        .card p { margin: 0; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">SheCodes — Emplois du temps</span>
        <div>
            <span id="userRole" style="margin-right: 15px;"></span>
            <button onclick="logout()">Déconnexion</button>
        </div>
    </nav>
    <div class="container">
        <h1>Tableau de bord</h1>
        <p>Bienvenue dans l'application de gestion des emplois du temps.</p>
        <div class="cards">
            <div class="card" onclick="alert('Bientôt disponible')">
                <h3>Enseignants</h3>
                <p>Gérer les enseignants et leurs indisponibilités</p>
            </div>
            <div class="card" onclick="alert('Bientôt disponible')">
                <h3>Emplois du temps</h3>
                <p>Créer et publier les emplois du temps</p>
            </div>
            <div class="card" onclick="alert('Bientôt disponible')">
                <h3>Salles & Groupes</h3>
                <p>Consulter les salles et les groupes</p>
            </div>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';
        
        const role = localStorage.getItem('role') || 'Utilisateur';
        document.getElementById('userRole').textContent = 'Rôle : ' + role;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
